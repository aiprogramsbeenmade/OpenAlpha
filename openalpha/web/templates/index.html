<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAlpha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
            },
            svg: {
                fontCache: 'global',
            },
        };
    </script>
    <script src="{{ url_for('static', filename='mathjax/tex-svg.js') }}" async></script>
    <script src="{{ url_for('static', filename='plotly/plotly.min.js') }}"></script>
    <script src="{{ url_for('static', filename='mathlive/mathlive.min.js') }}"></script>
</head>
<body>
    <header>
        <h1>OpenAlpha</h1>
        <p class="subtitle">Calcolatore matematico locale</p>
    </header>

    <div class="layout">
        <main class="main-column">
            <div class="input-bar">
                <select id="operation-select" title="Operazione">
                    <option value="simplify">simplify</option>
                </select>

                <div class="input-mode-toggle" role="tablist" aria-label="Modalità di input">
                    <button type="button" id="mode-text-btn" class="mode-btn active" data-mode="text" role="tab" aria-selected="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg>
                        <span>Testo</span>
                    </button>
                    <button type="button" id="mode-visual-btn" class="mode-btn" data-mode="visual" role="tab" aria-selected="false">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M18 7V5a1 1 0 0 0-1-1H6.5a.5.5 0 0 0-.4.8l4.5 6a2 2 0 0 1 0 2.4l-4.5 6a.5.5 0 0 0 .4.8H17a1 1 0 0 0 1-1v-2"/></svg>
                        <span>Visuale</span>
                    </button>
                </div>

                <div class="input-slot" id="input-slot-text">
                    <input
                        type="text"
                        id="input-expression"
                        placeholder="Scrivi un'espressione, es. (x + 1)**2"
                        autocomplete="off"
                        autofocus
                    >
                </div>

                <div class="input-slot" id="input-slot-visual" hidden>
                    <math-field
                        id="visual-editor"
                        class="visual-editor"
                        placeholder="Scrivi un'espressione, es. (x+1)^2"
                    ></math-field>
                </div>

                <button id="calculate-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-lg" aria-hidden="true"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
                    <span>Calcola</span>
                </button>
            </div>

            <div class="keyboard">
                <div class="keyboard-tabs">
                    <button class="tab active" data-tab="basic">Basic</button>
                    <button class="tab" data-tab="calculus">Calculus</button>
                    <button class="tab" data-tab="algebra">Algebra</button>
                    <button class="tab" data-tab="trig">Trig</button>
                    <button class="tab" data-tab="plot">Plot</button>
                </div>

                <div class="keyboard-panel active" data-panel="basic">
                    <button data-insert="**2">x²</button>
                    <button data-insert="sqrt()" data-cursor-offset="-1">√</button>
                    <button data-insert="pi">π</button>
                    <button data-insert="e">e</button>
                    <button data-insert="(">(</button>
                    <button data-insert=")">)</button>
                    <button data-insert="+">+</button>
                    <button data-insert="-">−</button>
                    <button data-insert="*">×</button>
                    <button data-insert="/">÷</button>
                    <button data-insert="**">^</button>
                </div>

                <div class="keyboard-panel" data-panel="calculus">
                    <button data-insert="integrate(, x)" data-cursor-offset="-4">∫</button>
                    <button data-insert="diff(, x)" data-cursor-offset="-4">d/dx</button>
                    <button data-insert="limit(, x, 0)" data-cursor-offset="-7">lim</button>
                    <button data-insert="dsolve()" data-cursor-offset="-1">ODE</button>
                </div>

                <div class="keyboard-panel" data-panel="algebra">
                    <button data-insert="solve()" data-cursor-offset="-1">solve</button>
                    <button data-insert="solve_system()" data-cursor-offset="-1">system</button>
                    <button data-insert="nsolve()" data-cursor-offset="-1">nsolve</button>
                    <button data-insert="=">=</button>
                </div>

                <div class="keyboard-panel" data-panel="trig">
                    <button data-insert="sin()" data-cursor-offset="-1">sin</button>
                    <button data-insert="cos()" data-cursor-offset="-1">cos</button>
                    <button data-insert="tan()" data-cursor-offset="-1">tan</button>
                    <button data-insert="asin()" data-cursor-offset="-1">sin⁻¹</button>
                    <button data-insert="acos()" data-cursor-offset="-1">cos⁻¹</button>
                    <button data-insert="atan()" data-cursor-offset="-1">tan⁻¹</button>
                    <button data-insert="log()" data-cursor-offset="-1">log</button>
                    <button data-insert="exp()" data-cursor-offset="-1">exp</button>
                </div>

                <div class="keyboard-panel" data-panel="plot">
                    <button data-insert="plot()" data-cursor-offset="-1">plot 2D</button>
                    <button data-insert="plot3d()" data-cursor-offset="-1">plot 3D</button>
                </div>
            </div>

            <div id="preview" class="preview"></div>

            <section class="result-area">
                <h2>Risultato</h2>
                <div id="result-content">
                    <p class="placeholder">In attesa di un calcolo...</p>
                </div>
            </section>
        </main>

        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Cronologia</h2>
                <button id="clear-history" title="Pulisci cronologia">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon" aria-hidden="true"><path d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21"/><path d="m5.082 11.09 8.828 8.828"/></svg>
                    <span>Pulisci</span>
                </button>
            </div>
            <ul id="history-list" class="history-list">
                <!-- Riempita dinamicamente da script.js -->
            </ul>
        </aside>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>

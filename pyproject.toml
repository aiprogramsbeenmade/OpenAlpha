[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openalpha"
version = "0.1.0"
description = "Calcolatore matematico simbolico locale, open source e modulare"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["openalpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"